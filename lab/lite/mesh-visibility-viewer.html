<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Babylon Lite — Mesh Visibility Viewer (Dual)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { display: flex; width: 100vw; height: 100vh; }
    .viewer-panel {
      position: relative; flex: 1 1 50%; min-width: 0; overflow: hidden;
      border-left: 1px solid #30363d;
    }
    .viewer-panel:first-child { border-left: none; }
    .viewer-panel canvas { width: 100%; height: 100%; display: block; }

    .drop-zone {
      position: absolute; top: 1rem; left: 50%; transform: translateX(-50%);
      z-index: 10; width: min(85%, 420px);
      padding: 1rem 1.25rem; border-radius: 10px;
      background: rgba(13, 17, 23, 0.85); border: 1px dashed #30363d;
      color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.drag-over { border-color: #58a6ff; background: rgba(13, 17, 23, 0.95); }
    .drop-zone.hidden { opacity: 0.6; }
    .drop-zone h2 { font-size: 0.9rem; margin: 0 0 0.35rem; }
    .drop-zone .status { font-size: 0.78rem; color: #8b949e; }

    .layers-panel {
      position: absolute; top: 1rem; right: 1rem; z-index: 10;
      width: 200px; max-height: 70vh; overflow-y: auto;
      padding: 0.75rem 0.9rem; border-radius: 10px;
      background: rgba(13, 17, 23, 0.85); border: 1px solid #30363d;
      color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .layers-panel.hidden { display: none; }
    .layers-panel h3 { font-size: 0.85rem; margin: 0 0 0.5rem; color: #8b949e; font-weight: 600; }
    .layer-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.2rem 0; font-size: 0.8rem;
    }
    .layer-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layer-dup-badge { font-size: 0.65rem; color: #8b949e; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="app">
    <div class="viewer-panel" id="panel-a">
      <canvas id="renderCanvas"></canvas>
      <div class="drop-zone" id="drop-zone-a">
        <h2>Model A</h2>
        <div class="status" id="status-a">Drop a .glb/.gltf file here, or click to browse.</div>
        <input class="file-input" id="file-input-a" type="file" accept=".glb,.gltf" style="display:none" />
      </div>
      <div class="layers-panel hidden" id="layers-panel-a">
        <h3>Layers</h3>
        <div id="layers-list-a"></div>
      </div>
    </div>
    <div class="viewer-panel" id="panel-b">
      <canvas id="renderCanvasB"></canvas>
      <div class="drop-zone" id="drop-zone-b">
        <h2>Model B</h2>
        <div class="status" id="status-b">Drop a .glb/.gltf file here, or click to browse.</div>
        <input class="file-input" id="file-input-b" type="file" accept=".glb,.gltf" style="display:none" />
      </div>
      <div class="layers-panel hidden" id="layers-panel-b">
        <h3>Layers</h3>
        <div id="layers-list-b"></div>
      </div>
    </div>
  </div>
  <script src="/loader.js"></script>
  <script type="module" src="/lite/src/lite/mesh-visibility-viewer.ts"></script>
</body>
</html>
